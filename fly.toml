# The site on Fly.io: one machine in the personal organization, created with
# `fly apps create giggleton --org personal`. GitHub Actions deploys it on every push to main;
# see .github/workflows/deploy.yml.
app = "giggleton"
primary_region = "ord"
kill_signal = "SIGTERM"

[build]

[env]
  PHX_HOST = "giggleton.pocketbookvote.com"
  PHX_OTHER_HOSTS = "giggleton.fly.dev"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # LiveView demos hold a socket open, so the one machine stays up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1000
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"
    # The check reaches the machine over plain HTTP. Marking it as HTTPS, as Fly's proxy marks
    # visitors' requests, keeps force_ssl from answering it with a redirect, which fails it.
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
